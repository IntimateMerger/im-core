auditLevel: high
engineStrict: true
ignoreScripts: true
minimumReleaseAge: 10080 # 1 week
minimumReleaseAgeExclude:
  - esbuild
  - '@esbuild/*'
  - form-data
  - tmp
  # brace-expansion 5.0.8 / js-yaml 5.2.2 (いずれも 2026-07-23 公開) が
  # minimumReleaseAge (7日) を超えたら削除すること -> 2026-07-31 以降
  - brace-expansion
  - js-yaml
overrides:
  tmp@<0.2.7: '>=0.2.7 <1.0.0'
  esbuild@<0.28.1: '>=0.28.1 <1.0.0'
  ws@<8.21.0: '>=8.21.0 <9.0.0'
  form-data@<4.0.6: '>=4.0.6 <5.0.0'
  # 2026-07 audit 波の新規 advisory 対応
  'brace-expansion@1': '>=5.0.8'
  'js-yaml@4': '>=5.2.2'
  'brace-expansion@>=3 <5.0.8': '>=5.0.8'
  # 2026-07-27 audit 波の新規 advisory 対応
  'brace-expansion@2': '>=5.0.8'
  'minimatch@<10.0.0': '>=10.2.4'
  'postcss@<8.5.18': '>=8.5.18'
  'fast-uri@>=3.0.0 <3.1.4': '>=3.1.4'
packageManagerStrictVersion: true
savePrefix: ""
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080 # 1 week
